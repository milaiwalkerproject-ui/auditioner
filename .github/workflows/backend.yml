name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - "content/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "content/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests
      # The audition-feed crawler (backend/crawler) has its own dependencies and tests;
      # they need no network and no model (fake transport + fake Anthropic client).
      - run: pip install -r backend/crawler/requirements-dev.txt
      - run: pytest -q backend/crawler/tests
      - run: python -m crawler --version
        working-directory: backend
