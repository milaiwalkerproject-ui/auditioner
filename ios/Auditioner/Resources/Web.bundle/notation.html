<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Notation</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1E2E37;
      --brass: #B5832A;
      --paper: transparent;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #E9ECEE;
        --brass: #D9A54A;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: contain;
    }
    #score {
      padding: 8px 0 160px 0;
      min-height: 100px;
    }
    #score svg {
      display: block;
      margin: 0 auto;
      fill: var(--ink);
      color: var(--ink);
      max-width: 100%;
    }
    #score svg .definition-scale {
      color: var(--ink);
    }
    #score g.note.is-sounding,
    #score g.rest.is-sounding {
      fill: var(--brass);
      color: var(--brass);
    }
    #score g.note.is-sounding * ,
    #score g.rest.is-sounding * {
      fill: var(--brass);
      stroke: var(--brass);
    }
    #score g.note {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="score"></div>
  <script src="verovio-toolkit-wasm.js"></script>
  <script src="notation.js"></script>
</body>
</html>
